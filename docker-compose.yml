services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres_password}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-mvp_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-mvp_app_password}
      POSTGRES_APP_DB: ${POSTGRES_APP_DB:-mvp_phase1}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-mvp_phase1_test}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - mvp_phase1_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mvp_phase1_postgres_data:
